name: Quality

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  # Manual trigger. A GitHub Actions outage on 2026-08-06 stopped scheduling runs
  # entirely — two pushes to main landed ungated and there was no way to ask for a
  # run after the fact. `scripts/ci-local.sh` runs the same checks off-GitHub.
  workflow_dispatch:

jobs:
  # The same non-browser gate as local close-out: the trusted pre-push guard,
  # pinned tools, test-count ratchets and zero-skip checks all run here.  The
  # browser checks stay split below so their evidence remains easy to inspect.
  gate:
    runs-on: ubuntu-latest
    env:
      PUSH_BEFORE: ${{ github.event.before }}
      PULL_BASE: ${{ github.event.pull_request.base.sha }}
      # GitHub forces ANSI colour even when ci-local redirects Vitest to a log.
      # Keep the machine-read count summary plain so the ratchet can parse it.
      FORCE_COLOR: "0"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ci-local judges a branch with the copy of the guard on trusted main.  A
      # main push is detached and replayed as its recorded Coupon-Batch so an
      # approved gate-maintenance batch cannot approve itself after the merge.
      - name: Restore the trusted main comparison
        shell: bash
        run: |
          set -euo pipefail
          current="$GITHUB_SHA"
          git checkout --detach "$current"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            base="$PUSH_BEFORE"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$current^"
            fi
            batch="$(git log -1 --format=%B "$current" | sed -nE 's/^Coupon-Batch: ([0-9]+)$/\1/p' | tail -1)"
            if [[ -n "$batch" ]]; then
              replay_branch="feat/batch-${batch}-ci-replay"
            else
              replay_branch="ci/main-${GITHUB_RUN_ID}"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PULL_BASE"
            replay_branch="${GITHUB_HEAD_REF:-ci/pull-request-${GITHUB_RUN_ID}}"
          elif [[ "$GITHUB_REF_NAME" != "main" ]]; then
            base="origin/main"
            replay_branch="$GITHUB_REF_NAME"
          else
            # A manual run on current main verifies the committed tree.  There
            # is no proposal to compare, so main is its own trusted baseline.
            base="$current"
            replay_branch="ci/manual-${GITHUB_RUN_ID}"
          fi

          git branch -f main "$base"
          git checkout -B "$replay_branch" "$current"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.7
      - run: SKIP_PROD_BUNDLE=1 scripts/ci-local.sh

  prod-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web build
        env:
          VITE_API_URL: https://api.example.invalid
      - run: scripts/run-prod-bundle-smoke.sh

  # The seeded journey: members claim unique picks, the round locks and settles,
  # and standings are read through a production bundle and the real API on scratch
  # PostgreSQL. It runs the local gate's own runner, so the two cannot drift.
  coupon-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ci-local.sh builds its pinned venv from requirements-dev.txt with uv.
      - run: pip install uv==0.11.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: scripts/ci-local.sh --journey-only
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coupon-journey
          path: apps/web/test-results/coupon-journey
          retention-days: 7
