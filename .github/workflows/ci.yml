name: Quality

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  # Manual trigger. A GitHub Actions outage on 2026-08-06 stopped scheduling runs
  # entirely — two pushes to main landed ungated and there was no way to ask for a
  # run after the fact. `scripts/ci-local.sh` runs the same checks off-GitHub.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_coupon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/the_coupon_test
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      SCHEDULER_ENABLED: "false"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: alembic upgrade head
      - run: pytest

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import pathlib
          import json
          import tomllib

          root = pathlib.Path.cwd()
          railway = tomllib.loads((root / "railway.toml").read_text())
          nixpacks = tomllib.loads((root / "nixpacks.toml").read_text())
          vercel = json.loads((root / "apps/web/vercel.json").read_text())

          assert railway["build"]["builder"] == "nixpacks"
          assert railway["build"]["nixpacksConfigPath"] == "nixpacks.toml"
          assert railway["deploy"]["healthcheckPath"] == "/api/v1/health/ready"
          assert railway["deploy"]["numReplicas"] == 1
          assert railway["deploy"]["sleepApplication"] is False
          assert railway["deploy"]["ipv6EgressEnabled"] is True
          assert railway["deploy"]["multiRegionConfig"] == {
              "europe-west4-drams3a": {"numReplicas": 1}
          }
          assert "postgresql_17" in nixpacks["phases"]["setup"]["nixPkgs"]
          install_cmd = " ".join(nixpacks["phases"]["install"]["cmds"])
          assert "python -m venv --copies /opt/venv" in install_cmd
          assert "apps/api/requirements.txt" in install_cmd
          assert nixpacks["phases"]["install"]["paths"] == ["/opt/venv/bin"]

          start_cmd = nixpacks["start"]["cmd"]
          assert "python -m src.runtime_secrets" in start_cmd
          assert "alembic -c apps/api/alembic.ini upgrade head" in start_cmd
          assert "uvicorn src.main:app" in start_cmd
          assert start_cmd.index("python -m src.runtime_secrets") < start_cmd.index(
              "alembic -c apps/api/alembic.ini upgrade head"
          )
          assert start_cmd.index(
              "alembic -c apps/api/alembic.ini upgrade head"
          ) < start_cmd.index("uvicorn src.main:app")

          assert not (root / "vercel.json").exists()
          assert vercel["installCommand"] == "pnpm install --frozen-lockfile"
          assert vercel["buildCommand"] == "pnpm build"
          assert vercel["outputDirectory"] == "dist"
          assert vercel["rewrites"][0]["destination"] == "/index.html"
          assert any(
              header["source"] == "/sw.js" for header in vercel["headers"]
          )
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
        env:
          VITE_API_URL: https://api.example.invalid

  prod-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web build
        env:
          VITE_API_URL: https://api.example.invalid
      - run: pnpm --dir apps/web exec vite preview --host 127.0.0.1 > /tmp/the-coupon-vite.log 2>&1 & sleep 5
      - run: pnpm --dir apps/web exec playwright test -c playwright.prod-bundle.config.ts
