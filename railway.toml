# Canonical Railway build config for the FastAPI backend.
#
# Use Railway's native Nixpacks builder from the repo root so the service can
# see apps/api and migrations without requiring local container tooling.

[build]
builder = "nixpacks"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
# Generous timeout: the healthcheck only goes green after `alembic upgrade head`
# completes from the Nixpacks start command, so allow headroom for a migration
# on boot.
healthcheckPath = "/api/v1/health/ready"
healthcheckTimeout = 300
# One replica is a correctness requirement, not a cost choice: nixpacks.toml runs
# `alembic upgrade head` inside the web process, and Alembic takes no lock, so a second
# replica races the same upgrade against the same database. Batch 100 stopped this being
# a note — `src.migration_guard` refuses to migrate above one, `nixpacks.toml` carries the
# number into the image as DEPLOY_REPLICA_COUNT, and `tests/test_migration_guard.py`
# fails if the two disagree. Raising either without the other does not get you two
# replicas; it gets you a refused boot or a red gate.
numReplicas = 1
sleepApplication = false
ipv6EgressEnabled = true
multiRegionConfig = { "europe-west4-drams3a" = { numReplicas = 1 } }
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
