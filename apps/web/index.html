<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-mount theme apply — read stored preference (or system pref for
      // 'system'/unset) and set the html class + color-scheme before React
      // mounts. Prevents a flash of the wrong palette on cold load.
      (function () {
        try {
          var stored = localStorage.getItem('coupon_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            stored === 'light' ? 'light' :
            stored === 'dark' ? 'dark' :
            stored === 'system' ? (systemDark ? 'dark' : 'light') :
            'dark'; // default for first-time visitors: dark (matches ThemeContext)
          var html = document.documentElement;
          html.classList.remove('light', 'dark');
          html.classList.add(resolved);
          html.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#071A3D' : '#F7F8FA');
        } catch (e) { /* localStorage may be unavailable */ }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No maximum-scale and no user-scalable=no: withdrawing zoom is a WCAG
         1.4.4 failure, and on a phone-first app whose pick screen is a grid of
         two-decimal odds at 10px it is the members with low vision who pay for
         it. The reason that attribute is usually present — iOS Safari zooming
         when an input takes focus — is handled where it belongs, by keeping
         every input at >= 16px on mobile. See src/test/viewport.test.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071A3D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Coupon" />
    <title>The Coupon</title>
    <meta name="description" content="The Coupon — one unique Saturday football pick per member, frozen odds, weekly points." />
    <meta property="og:title" content="The Coupon" />
    <meta property="og:description" content="A private weekly football accumulator game for friends. Points only." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Coupon" />
    <meta name="twitter:description" content="A private weekly football accumulator game for friends. Points only." />
    <meta name="twitter:image" content="/icon-512.png" />
    <!-- Preload the splash-critical font weight so the LCP wordmark paints
         without a render-blocking round-trip. The woff2 is self-hosted and
         precached by the service worker. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/jetbrains-mono-600.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
